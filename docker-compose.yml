services:
  backend:
    build:
      dockerfile: node-backend/Dockerfile
    container_name: coral-data-collection-backend
    restart: unless-stopped
    volumes:
      - $HOME/Documents/CoRal_Recorder/data:${CORAL_DATA_DIR}
    ports:
      - 3333:3333
    expose:
      - 3333
    environment:
     - CORAL_PORT=3333
     - CORAL_DATA_DIR=/files
     - CORAL_FIXTURE_DIR=/app/node-backend/fixtures

  frontend:
    build:
      dockerfile: coral-data-collection-app/Dockerfile
    container_name: coral-data-collection-frontend
    restart: unless-stopped
    expose:
      - 3000
    ports:
      - "3000:80"
